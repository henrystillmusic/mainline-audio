<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmission Confirmed | Mainline Audio</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: "Satoshi", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #canvas-layer { 
      position: fixed; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 1; 
      pointer-events: none;
    }

    /* Stripped the frosted glass border container to let the text float cleanly over the dark space */
    .thank-you-container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 48px;
      max-width: 440px;
      width: min(440px, 90vw);
    }

    .status-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(245,245,245,0.22);
      margin-bottom: 32px;
    }

    .thank-you-headline {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      display: block;
      background: linear-gradient(90deg, #ffffff, #dffcff, #f7eaff, #ece8ff, #ffffff);
      background-size: 400%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: flow 24s linear infinite; /* Tuned to a smoother, intentional drift */
    }

    @keyframes flow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .thank-you-sub {
      font-size: 12px;
      font-weight: 400;
      color: rgba(245,245,245,0.35);
      letter-spacing: 0.07em;
      line-height: 1.9;
      margin-bottom: 48px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(245,245,245,0.2);
      color: rgba(245,245,245,0.6);
      padding: 13px 34px;
      font-family: "Satoshi", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      border-color: rgba(245,245,245,0.55);
      color: #f5f5f5;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<canvas id="canvas-layer"></canvas>

<main class="thank-you-container">
  <p class="status-eyebrow">Transmission Confirmed</p>
  <h1 class="thank-you-headline">Project<br />Received.</h1>
  <div class="thank-you-sub">
    <p>I will review the audio files and get back to you within 24 to 48 hours.</p>
  </div>
  <a class="btn-outline" href="index.html">Return to Mainline</a>
</main>

<script>
/* ════════════════════════════════════════════════════════════
    UNIFIED BACKGROUND ENGINE (ABSOLUTE BLACK STUDIO MODE)
════════════════════════════════════════════════════════════ */
(function(){
  const canvas = document.getElementById('canvas-layer');
  const ctx = canvas.getContext('2d');
  
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const SNOW_COUNT = 100; 
  const snowParticles = [];
  for(let i = 0; i < SNOW_COUNT; i++){
    snowParticles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + .4,
      d: Math.random() * 0.8 + 0.4
    });
  }

  function engineLoop(ts) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);
    
    // Flat, deep studio canvas base
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    // Removed all background radial gradients and blue lighting beams 
    // to maintain a stark, distraction-free field of absolute black.

    // Pure, subtle drifting micro-particles over the black canvas
    ctx.fillStyle = 'rgba(245, 245, 245, 0.22)'; // Locked into your exact font color tone
    snowParticles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, false);
      ctx.fill();
      p.y += p.d;
      p.x += Math.sin(p.y * 0.01) * 0.4;
      if(p.y > H){ p.y = -10; p.x = Math.random() * W; }
    });

    requestAnimationFrame(engineLoop);
  }
  requestAnimationFrame(engineLoop);
})();
</script>
