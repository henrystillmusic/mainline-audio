<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmission Confirmed | Mainline Audio</title>
  <link rel="icon" href="favicon.ico">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: "Satoshi", sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #canvas-layer { 
      position: fixed; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 1; 
      pointer-events: none;
    }

    .thank-you-content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 24px;
      max-width: 460px;
      width: 100%;
    }

    .status-eyebrow {
      font-size: 10px;
      letter-spacing: .32em;
      text-transform: uppercase;
      color: rgba(184,248,255,.58);
      margin-bottom: 24px;
    }

    .thank-you-headline {
      font-size: clamp(2.5rem, 7vw, 4.2rem);
      line-height: .95;
      font-weight: 500;
      letter-spacing: -.05em;
      margin-bottom: 24px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #ffffff, #b8f8ff, #ffe0ff, #f0e8ff, #ffffff);
      background-size: 400%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: flow 18s ease infinite;
    }

    @keyframes flow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .thank-you-message {
      font-size: 0.95rem;
      line-height: 1.75;
      color: rgba(245,245,245,.66);
      margin-bottom: 42px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(245,245,245,0.2);
      color: rgba(245,245,245,0.6);
      padding: 13px 34px;
      font-family: "Satoshi", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      border-color: rgba(245,245,245,0.55);
      color: #f5f5f5;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <canvas id="canvas-layer"></canvas>

  <main class="thank-you-content">
    <p class="status-eyebrow">Transmission Confirmed</p>
    <h1 class="thank-you-headline gradient-text">Project<br>Received.</h1>
    <p class="thank-you-message">
      I will review the audio files and get back to you within 24 to 48 hours.
    </p>

    <a class="btn-outline" href="index.html">Return to Mainline</a>
  </main>

  <script>
  /* ════════════════════════════════════════════════════════════
      UNIFIED BACKGROUND ENGINE (ABSOLUTE BLACK STUDIO MODE)
  ════════════════════════════════════════════════════════════ */
  (function(){
    const canvas = document.getElementById('canvas-layer');
    const ctx = canvas.getContext('2d');
    
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);

    const SNOW_COUNT = 100; 
    const snowParticles = [];
    for(let i = 0; i < SNOW_COUNT; i++){
      snowParticles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.5 + .4,
        d: Math.random() * 0.8 + 0.4
      });
    }

    function engineLoop(ts) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(245, 245, 245, 0.22)';
      snowParticles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, false);
        ctx.fill();
        p.y += p.d;
        p.x += Math.sin(p.y * 0.01) * 0.4;
        if(p.y > H){ p.y = -10; p.x = Math.random() * W; }
      });

      requestAnimationFrame(engineLoop);
    }
    requestAnimationFrame(engineLoop);
  })();
  </script>
</body>
</html>
