    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: 'Satoshi', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── SNOW ── */
    #snow {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* ── SITE ── */
    .site {
      position: relative;
      z-index: 1;
    }

    /* ── GRADIENT TEXT ── */
    .gradient-text {
      background: linear-gradient(90deg, #ffffff, #b8f8ff, #ffe0ff, #f0e8ff, #ffffff);
      background-size: 400%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: flow 18s ease infinite;
    }

    @keyframes flow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ── NAV ── */
    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 32px 56px;
    }

    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
    }

    .nav-links a {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,245,245,0.28);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #f5f5f5;
    }

    /* ── HERO ── */

      flex-direction: column;

      text-align: center;

      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(245,245,245,0.18);
      margin-bottom: 48px;
    }

    .hero-logo {
      width: 440px;
      max-width: 88%;
      filter: drop-shadow(0 0 40px rgba(184,248,255,0.18));
      opacity: 0.93;
      margin-bottom: 48px;
    }

    .hero-sub {
      font-size: 12px;
      font-weight: 400;
      color: rgba(245,245,245,0.28);
      letter-spacing: 0.1em;
      line-height: 1.9;
      margin-bottom: 48px;
    }

    .hero-cta {
      display: flex;
      gap: 20px;
      align-items: center;
    }

      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }
