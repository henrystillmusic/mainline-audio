<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mainline Audio — Listen</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: "Satoshi", sans-serif;
    overflow: hidden;
  }

  /* ── Canvases ── */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bg   { z-index: 1; }
  #eq   { z-index: 2; pointer-events: none; }
  #snow { z-index: 3; pointer-events: none; }

  /* ── Logo + tagline ── */
  .stage {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-bottom: 30vh;
    pointer-events: none;
  }

  .logo-img {
    width: min(340px, 70vw);
    filter: drop-shadow(0 0 36px rgba(184,248,255,0.14));
    opacity: 0;
    animation: rise 2.4s cubic-bezier(.22,1,.36,1) .6s forwards;
  }

  .rule {
    width: min(340px, 70vw); height: 1px;
    background: rgba(184,248,255,0.09);
    margin: 24px 0 20px;
    opacity: 0;
    animation: rise 2s ease 1.4s forwards;
  }

  .tagline {
    font-size: clamp(.65rem, 1.4vw, .8rem);
    font-weight: 500; letter-spacing: .3em;
    text-transform: uppercase;
    opacity: 0;
    animation: rise 2s ease 1.8s forwards;
  }

  /* ── Player ── */
  .player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 32px;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .player.show { opacity: 1; transform: translateY(0); }

  /* Track info */
  .track-info {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 20px;
  }

  .track-title {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(245,245,245,0.45);
    min-width: 160px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Controls row */
  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }

  .ctrl-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .18s, border-color .18s;
    flex-shrink: 0;
    color: rgba(245,245,245,0.6);
    font-size: 15px;
    user-select: none;
  }
  .ctrl-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
    color: #f5f5f5;
  }
  .ctrl-btn.play-btn {
    width: 54px; height: 54px;
    border-color: rgba(184,248,255,0.18);
    background: rgba(184,248,255,0.06);
  }
  .ctrl-btn.play-btn:hover {
    background: rgba(184,248,255,0.14);
    border-color: rgba(184,248,255,0.35);
  }

  /* Progress bar */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    width: min(420px, 88vw);
    margin-bottom: 14px;
  }
  .time-label {
    font-size: 9px;
    letter-spacing: .1em;
    color: rgba(245,245,245,0.22);
    font-variant-numeric: tabular-nums;
    width: 32px;
    flex-shrink: 0;
  }
  .time-label.right { text-align: right; }

  .progress-track {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    position: relative;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #b8f8ff, #ffe0ff);
    border-radius: 99px;
    width: 0%;
    pointer-events: none;
    transition: width .25s linear;
  }

  /* Volume */
  .volume-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vol-icon {
    color: rgba(245,245,245,0.25);
    font-size: 12px;
  }
  input[type=range].vol-slider {
    -webkit-appearance: none;
    width: 90px;
    height: 3px;
    border-radius: 99px;
    background: rgba(255,255,255,0.1);
    accent-color: rgba(184,248,255,0.7);
    cursor: pointer;
    outline: none;
  }
  input[type=range].vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(184,248,255,0.8);
    cursor: pointer;
  }

  /* Gradient text */
  .gradient-text {
    background: linear-gradient(90deg, #ffffff, #b8f8ff, #ffe0ff, #f0e8ff, #ffffff);
    background-size: 400%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: flow 18s ease infinite;
  }

  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Click-to-start overlay */
  .start-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: rgba(10,10,10,0.0);
    cursor: pointer;
    transition: opacity .6s;
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-hint {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: rgba(245,245,245,0.22);
    animation: pulse 2.8s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .22; }
    50%       { opacity: .55; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="eq"></canvas>
<canvas id="snow"></canvas>

<!-- Logo -->
<div class="stage">
  <img class="logo-img"
    src="https://mainline-audio.com/MAINLINE-AUDIO-SITE/mainline_logo_transparent.png"
    alt="Mainline Audio" crossorigin="anonymous">
  <div class="rule"></div>
  <p class="tagline gradient-text">Mastering — Orlando, FL</p>
</div>

<!-- Player -->
<div class="player" id="player">
  <div class="track-info">
    <div class="track-title" id="track-title">—</div>
  </div>

  <div class="controls">
    <div class="ctrl-btn" id="prev-btn" title="Previous">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
      </svg>
    </div>

    <div class="ctrl-btn play-btn" id="play-btn" title="Play / Pause">
      <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5v14l11-7z"/>
      </svg>
      <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <path d="M6 19h4V5H6zm8-14v14h4V5z"/>
      </svg>
    </div>

    <div class="ctrl-btn" id="next-btn" title="Next">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 18l8.5-6L6 6zm8.5-6v6h2V6h-2z"/>
      </svg>
    </div>
  </div>

  <div class="progress-wrap">
    <span class="time-label" id="time-cur">0:00</span>
    <div class="progress-track" id="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="time-label right" id="time-dur">0:00</span>
  </div>

  <div class="volume-row">
    <span class="vol-icon">♪</span>
    <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.65">
  </div>
</div>

<!-- Start overlay -->
<div class="start-overlay" id="start-overlay">
  <p class="start-hint">Tap to listen</p>
</div>

<audio id="audio" preload="auto"></audio>

<script>
/* ════════════════════════════════
   AUDIO PLAYER
════════════════════════════════ */
const playlist = [
  { title: "Drift",                src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Drift_Master_01.mp3" },
  { title: "Draped",               src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Draped_Master_01.mp3" },
  { title: "Still Waters",         src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Still Waters_Master_01.mp3" },
  { title: "Weightless",           src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Weightless_Master_01.mp3" },
  { title: "When the Mud Settles", src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/when the mud settles.m4a" },
  { title: "Run Free",             src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/Run Free.mp3" },
];

function shuffle(arr){
  const s = [...arr];
  for(let i = s.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
}

const audio       = document.getElementById('audio');
const playBtn     = document.getElementById('play-btn');
const playIcon    = document.getElementById('play-icon');
const pauseIcon   = document.getElementById('pause-icon');
const nextBtn     = document.getElementById('next-btn');
const prevBtn     = document.getElementById('prev-btn');
const trackTitle  = document.getElementById('track-title');
const progressFill= document.getElementById('progress-fill');
const progressTrack=document.getElementById('progress-track');
const timeCur     = document.getElementById('time-cur');
const timeDur     = document.getElementById('time-dur');
const volSlider   = document.getElementById('vol-slider');
const playerEl    = document.getElementById('player');
const startOverlay= document.getElementById('start-overlay');

let shuffled = shuffle(playlist);
let idx = 0;
let started = false;
let analyser = null, dataArray = null, audioCtx = null, sourceNode = null;

function fmt(s){
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function loadTrack(i, autoplay){
  const t = shuffled[i];
  audio.src = t.src;
  trackTitle.textContent = t.title;
  progressFill.style.width = '0%';
  timeCur.textContent = '0:00';
  timeDur.textContent = '0:00';
  if(autoplay) audio.play().catch(()=>{});
}

function updatePlayPause(){
  const playing = !audio.paused;
  playIcon.style.display  = playing ? 'none' : 'block';
  pauseIcon.style.display = playing ? 'block' : 'none';
}

function setupAnalyser(){
  if(audioCtx) return;
  audioCtx  = new (window.AudioContext || window.webkitAudioContext)();
  sourceNode= audioCtx.createMediaElementSource(audio);
  analyser  = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function startAudio(){
  if(started) return;
  started = true;
  setupAnalyser();
  loadTrack(idx, true);
  playerEl.classList.add('show');
  startOverlay.classList.add('hidden');
}

startOverlay.addEventListener('click', startAudio);

playBtn.addEventListener('click', () => {
  if(!started){ startAudio(); return; }
  if(audio.paused){ audio.play(); } else { audio.pause(); }
});

nextBtn.addEventListener('click', () => {
  idx = (idx + 1) % shuffled.length;
  if(idx === 0) shuffled = shuffle(playlist);
  loadTrack(idx, started);
});

prevBtn.addEventListener('click', () => {
  if(audio.currentTime > 3){
    audio.currentTime = 0;
  } else {
    idx = (idx - 1 + shuffled.length) % shuffled.length;
    loadTrack(idx, started);
  }
});

audio.addEventListener('ended', () => {
  idx = (idx + 1) % shuffled.length;
  if(idx === 0) shuffled = shuffle(playlist);
  loadTrack(idx, true);
});

audio.addEventListener('play',  updatePlayPause);
audio.addEventListener('pause', updatePlayPause);

audio.addEventListener('timeupdate', () => {
  if(!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  progressFill.style.width = pct + '%';
  timeCur.textContent = fmt(audio.currentTime);
});

audio.addEventListener('loadedmetadata', () => {
  timeDur.textContent = fmt(audio.duration);
});

progressTrack.addEventListener('click', e => {
  if(!audio.duration) return;
  const rect = progressTrack.getBoundingClientRect();
  const pct  = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pct * audio.duration;
});

volSlider.addEventListener('input', e => {
  audio.volume = parseFloat(e.target.value);
});
audio.volume = parseFloat(volSlider.value);


/* ════════════════════════════════
   BACKGROUND
════════════════════════════════ */
(function(){
  const c = document.getElementById('bg');
  const ctx = c.getContext('2d');
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  function draw(ts){
    const W = c.width, H = c.height;
    const t = ts * 0.00013;
    const topH = 222 + Math.sin(t) * 7;
    const botH = 198 + Math.sin(t * .5) * 5;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,   `hsl(${topH}, 48%, 4%)`);
    g.addColorStop(.45, `hsl(${topH-8}, 42%, 7%)`);
    g.addColorStop(.82, `hsl(${botH}, 36%, 10%)`);
    g.addColorStop(1,   `hsl(${botH-10}, 30%, 5%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for(let i = 0; i < 3; i++){
      const bx   = (Math.sin(ts * (0.00024 + i * 0.00008) + i * 2.1) * .5 + .5) * W;
      const by   = H * (0.04 + i * 0.07);
      const beam = ctx.createRadialGradient(bx, by, 0, bx, by, W * .52);
      beam.addColorStop(0,  `rgba(184,248,255,${0.028 - i * 0.007})`);
      beam.addColorStop(.7, 'rgba(0,0,0,0)');
      ctx.fillStyle = beam;
      ctx.fillRect(0, 0, W, H);
    }
    const vig = ctx.createRadialGradient(W*.5, H*.38, H*.14, W*.5, H*.38, H*.9);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();


/* ════════════════════════════════
   3D ROUNDED EQ BARS
   Horizontal row across the bottom.
   Each bar is a rounded 3D pill/cylinder
   rendered in isometric-style with:
   - top cap (ellipse, brightest)
   - body (rounded rect, mid)
   - shadow side (right edge, darkest)
   Reacts to Web Audio analyser when
   music is playing; falls back to
   organic sine animation when idle.
════════════════════════════════ */
(function(){
  const c = document.getElementById('eq');
  const ctx = c.getContext('2d');
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const BAR_COUNT = 48;

  // Per-bar idle animation params
  const bars = Array.from({length: BAR_COUNT}, (_, i) => ({
    phase: Math.random() * Math.PI * 2,
    freq:  0.2 + Math.random() * 0.6,
    amp:   0.3 + Math.random() * 0.7,
    fpos:  i / (BAR_COUNT - 1),   // 0=low, 1=high
    current: 0.08 + Math.random() * 0.3,
    target:  0.08,
  }));

  // Draw one rounded 3D bar
  // x, y = center-bottom of bar on screen
  // w = bar width, h = bar height (upward)
  // depth = how deep the 3D side extrusion looks
  // fpos = 0..1 for colour
  function drawPill(x, baseY, w, h, depth, fpos, alpha){
    if(h < 1) return;
    const r = w / 2;             // corner radius = half width (full pill)
    const topY  = baseY - h;     // top of bar
    const sideX = x + r;         // right edge
    const dY    = depth * 0.55;  // isometric depth drop

    // Hue sweep matching site palette
    const hue = 190 + fpos * 130;
    const sat = 32 + fpos * 20;

    // ── Right/shadow face (3D side, lower-right) ──
    ctx.beginPath();
    ctx.moveTo(sideX,        topY + r);           // top-right of body
    ctx.lineTo(sideX,        baseY - r);           // bottom-right of body
    ctx.arc(x, baseY - r, r, 0, Math.PI, false);  // bottom cap RIGHT side
    ctx.lineTo(x + r,        baseY - r + dY);
    ctx.lineTo(x + r,        topY + r + dY);
    ctx.arc(x, topY + r + dY, r, 0, Math.PI, false); // faux depth cap
    ctx.closePath();
    ctx.fillStyle = `hsla(${hue}, ${sat}%, 22%, ${alpha * 0.75})`;
    ctx.fill();

    // ── Body (front face — tall rounded rect) ──
    ctx.beginPath();
    ctx.moveTo(x - r, topY + r);
    ctx.arc(x, topY + r, r, Math.PI, 0);           // top cap arc
    ctx.lineTo(x + r, baseY - r);
    ctx.arc(x, baseY - r, r, 0, Math.PI);           // bottom cap arc
    ctx.closePath();

    const bodyGrad = ctx.createLinearGradient(x - r, topY, x + r, topY);
    bodyGrad.addColorStop(0,   `hsla(${hue}, ${sat + 8}%, 52%, ${alpha})`);
    bodyGrad.addColorStop(0.5, `hsla(${hue}, ${sat + 4}%, 42%, ${alpha})`);
    bodyGrad.addColorStop(1,   `hsla(${hue}, ${sat}%,     32%, ${alpha * 0.85})`);
    ctx.fillStyle = bodyGrad;
    ctx.fill();

    // ── Top ellipse cap (brightest — "lit from above") ──
    ctx.beginPath();
    ctx.ellipse(x, topY + r, r, r * 0.38, 0, 0, Math.PI * 2);
    const capGrad = ctx.createRadialGradient(x - r * 0.2, topY + r * 0.6, 0, x, topY + r, r);
    capGrad.addColorStop(0,   `hsla(${hue + 15}, ${sat + 20}%, 88%, ${alpha})`);
    capGrad.addColorStop(0.5, `hsla(${hue + 8},  ${sat + 12}%, 65%, ${alpha * 0.9})`);
    capGrad.addColorStop(1,   `hsla(${hue},       ${sat}%,     45%, ${alpha * 0.6})`);
    ctx.fillStyle = capGrad;
    ctx.fill();

    // ── Thin specular highlight line down left edge ──
    ctx.beginPath();
    ctx.moveTo(x - r + 1, topY + r);
    ctx.lineTo(x - r + 1, baseY - r);
    ctx.strokeStyle = `hsla(${hue + 20}, ${sat + 15}%, 90%, ${alpha * 0.3})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function draw(ts){
    const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);

    const t = ts * 0.001;

    // Layout — centered horizontal row
    const totalW   = W * 0.88;
    const barW     = totalW / BAR_COUNT;
    const pillW    = barW * 0.58;          // pill diameter
    const depth    = pillW * 0.35;         // 3D depth
    const startX   = (W - totalW) / 2 + barW / 2;
    const baseY    = H * 0.88;            // floor line
    const maxH     = H * 0.30;            // tallest possible bar

    bars.forEach((b, i) => {
      // Get analyser data if available
      if(analyser && dataArray && !audio.paused){
        analyser.getByteFrequencyData(dataArray);
        // Map bar index to frequency bin
        const bin = Math.floor((i / BAR_COUNT) * dataArray.length * 0.75);
        b.target = Math.max(0.04, dataArray[bin] / 255 * 0.95);
      } else {
        // Idle sine animation
        const v =
          Math.sin(t * b.freq       + b.phase) * b.amp * .55 +
          Math.sin(t * b.freq * 2.1 + b.phase * 1.4) * b.amp * .28 +
          Math.sin(t * b.freq * 0.4 + b.phase * .7)  * b.amp * .17;
        // Low freq bias: lows taller
        const lowBias = 1 - b.fpos * 0.4;
        b.target = Math.max(0.04, ((v + 1) / 2) * lowBias * 0.85);
      }

      // Smooth: fast attack, slow release
      const speed = b.current < b.target ? 0.18 : 0.07;
      b.current += (b.target - b.current) * speed;

      const x    = startX + i * barW;
      const h    = b.current * maxH;

      // Alpha: slight fade at edges for soft vignette
      const edgeFade = 1 - Math.pow(Math.abs((i / (BAR_COUNT - 1)) - 0.5) * 2, 2.5) * 0.35;

      drawPill(x, baseY, pillW, h, depth, b.fpos, 0.82 * edgeFade);
    });

    // Reflection — subtle mirror below baseY
    ctx.save();
    ctx.translate(0, baseY);
    ctx.scale(1, -0.18);
    ctx.translate(0, -baseY);
    ctx.globalAlpha = 0.18;
    bars.forEach((b, i) => {
      const x = startX + i * barW;
      const h = b.current * maxH * 0.5;
      drawPill(x, baseY, pillW, h, depth, b.fpos, 0.5);
    });
    ctx.restore();
    ctx.globalAlpha = 1;

    // Floor glow line
    const floorGlow = ctx.createLinearGradient(W*.1, baseY, W*.9, baseY);
    floorGlow.addColorStop(0,   'rgba(0,0,0,0)');
    floorGlow.addColorStop(0.2, 'rgba(184,248,255,0.06)');
    floorGlow.addColorStop(0.5, 'rgba(240,232,255,0.09)');
    floorGlow.addColorStop(0.8, 'rgba(184,248,255,0.06)');
    floorGlow.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = floorGlow;
    ctx.fillRect(W*.05, baseY - 1, W*.9, 2);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();


/* ════════════════════════════════
   SNOW — exact from your site
════════════════════════════════ */
(function(){
  const canvas = document.getElementById('snow');
  const c = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const particles = [];
  for(let i = 0; i < 220; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 2 + 1,
      d: Math.random() * 1.8 + 1
    });
  }

  function snow(){
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = 'rgba(230,255,255,0.8)';
    particles.forEach(p => {
      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2, false);
      c.fill();
      p.y += p.d;
      p.x += Math.sin(p.y * 0.01) * 0.8;
      if(p.y > canvas.height){ p.y = -10; p.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(snow);
  }
  snow();
})();
</script>
</body>
</html>
