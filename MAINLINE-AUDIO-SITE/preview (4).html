<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mainline Audio — Visualizer</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bg    { z-index: 1; }
  #coral { z-index: 2; }
  #snow  { z-index: 3; pointer-events: none; }

  .stage {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .logo-img {
    width: min(380px, 78vw);
    filter: drop-shadow(0 0 40px rgba(184,248,255,0.12));
    opacity: 0;
    animation: rise 2.4s cubic-bezier(.22,1,.36,1) .7s forwards;
  }

  .rule {
    width: min(380px, 78vw); height: 1px;
    background: rgba(184,248,255,0.08);
    margin: 28px 0 24px;
    opacity: 0;
    animation: rise 2s ease 1.5s forwards;
  }

  .tagline {
    font-family: "Satoshi", sans-serif;
    font-size: clamp(.7rem, 1.6vw, .85rem);
    font-weight: 500; letter-spacing: .3em;
    text-transform: uppercase;
    opacity: 0;
    animation: rise 2s ease 1.9s forwards;
  }

  .bottom-label {
    position: fixed; bottom: 36px; left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    font-family: "Satoshi", sans-serif;
    font-size: clamp(.52rem, 1.1vw, .63rem);
    font-weight: 500; letter-spacing: .34em;
    text-transform: uppercase;
    color: rgba(245,245,245,0.1);
    white-space: nowrap;
    opacity: 0;
    animation: rise 2s ease 2.4s forwards;
  }

  .gradient-text {
    background: linear-gradient(90deg, #ffffff, #b8f8ff, #ffe0ff, #f0e8ff, #ffffff);
    background-size: 400%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: flow 18s ease infinite;
  }

  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="coral"></canvas>
<canvas id="snow"></canvas>

<div class="stage">
  <img class="logo-img"
    src="https://mainline-audio.com/MAINLINE-AUDIO-SITE/mainline_logo_transparent.png"
    alt="Mainline Audio" crossorigin="anonymous">
  <div class="rule"></div>
  <p class="tagline gradient-text">Mastering — Orlando, FL</p>
</div>

<div class="bottom-label">mainline-audio.com</div>

<script>
let W = window.innerWidth, H = window.innerHeight;
window.addEventListener('resize', () => { W = window.innerWidth; H = window.innerHeight; });

/* ── 1. BACKGROUND ───────────────────────────── */
(function(){
  const c = document.getElementById('bg');
  const ctx = c.getContext('2d');
  function resize(){ c.width = W; c.height = H; }
  resize(); window.addEventListener('resize', resize);

  function draw(ts){
    const t = ts * 0.00014;
    const topH = 222 + Math.sin(t) * 7;
    const botH = 198 + Math.sin(t * .5) * 5;

    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,    `hsl(${topH}, 48%, 4%)`);
    g.addColorStop(0.45, `hsl(${topH - 8}, 42%, 7%)`);
    g.addColorStop(0.8,  `hsl(${botH}, 36%, 10%)`);
    g.addColorStop(1,    `hsl(${botH - 10}, 30%, 5%)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Caustic shimmer
    for(let i = 0; i < 4; i++){
      const bx   = (Math.sin(ts * (0.00026 + i * 0.00008) + i * 2.1) * .5 + .5) * W;
      const by   = H * (0.03 + i * 0.065);
      const beam = ctx.createRadialGradient(bx, by, 0, bx, by, W * .55);
      beam.addColorStop(0,  `rgba(184,248,255,${0.032 - i * 0.006})`);
      beam.addColorStop(.7, 'rgba(0,0,0,0)');
      ctx.fillStyle = beam;
      ctx.fillRect(0, 0, W, H);
    }

    // Vignette
    const vig = ctx.createRadialGradient(W*.5, H*.38, H*.15, W*.5, H*.38, H*.92);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.85)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();


/* ── 2. SOFT EQ METERS ─────────────────────────────
   Thick, pillowy graphic-EQ style columns.
   Not audio-reactive yet — it breathes like signal moving behind glass.
   Good for screen-recording as a branded visualizer loop.
──────────────────────────────────────────────── */
(function(){
  const c = document.getElementById('coral');
  const ctx = c.getContext('2d');

  function resize(){
    c.width = W * devicePixelRatio;
    c.height = H * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  resize(); window.addEventListener('resize', resize);

  const BANDS = 32;

  // Low/mid/high band behavior — more musical than random.
  const bands = Array.from({ length: BANDS }, (_, i) => {
    const n = i / (BANDS - 1);

    // Keep center/low-mid a little heavier, like a graphic EQ with body.
    const bodyCurve =
      0.42 +
      Math.exp(-Math.pow((n - 0.22) / 0.22, 2)) * 0.34 +
      Math.exp(-Math.pow((n - 0.58) / 0.18, 2)) * 0.20;

    return {
      phase: Math.random() * Math.PI * 2,
      phase2: Math.random() * Math.PI * 2,
      speed: 0.00022 + n * 0.00034 + Math.random() * 0.00012,
      speed2: 0.00009 + Math.random() * 0.00011,
      base: bodyCurve,
      amp: 0.10 + Math.random() * 0.22,
      glow: 0.45 + Math.random() * 0.4,
      hueShift: -8 + Math.random() * 16
    };
  });

  function roundedRect(ctx, x, y, w, h, r){
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
    ctx.lineTo(x, y + rr);
    ctx.quadraticCurveTo(x, y, x + rr, y);
    ctx.closePath();
  }

  function drawBand(x, y, w, h, hue, alpha, blur){
    ctx.save();
    ctx.shadowBlur = blur;
    ctx.shadowColor = `hsla(${hue}, 80%, 72%, ${alpha * 0.55})`;

    const g = ctx.createLinearGradient(0, y + h, 0, y);
    g.addColorStop(0.00, `hsla(${hue - 10}, 38%, 18%, 0.00)`);
    g.addColorStop(0.12, `hsla(${hue - 4}, 44%, 28%, ${alpha * 0.22})`);
    g.addColorStop(0.52, `hsla(${hue}, 58%, 48%, ${alpha * 0.48})`);
    g.addColorStop(0.82, `hsla(${hue + 10}, 72%, 70%, ${alpha * 0.62})`);
    g.addColorStop(1.00, `hsla(${hue + 18}, 92%, 82%, ${alpha * 0.74})`);

    roundedRect(ctx, x, y, w, h, w * 0.65);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  function draw(ts){
    ctx.clearRect(0, 0, W, H);

    // Overall veil so the meters feel behind smoked glass.
    ctx.globalCompositeOperation = 'lighter';

    const meterAreaTop = H * 0.13;
    const meterAreaHeight = H * 0.74;
    const baseY = H * 0.88;
    const sidePad = W * 0.055;
    const availableW = W - sidePad * 2;
    const slot = availableW / BANDS;
    const barW = Math.max(9, slot * 0.58);

    bands.forEach((b, i) => {
      const n = i / (BANDS - 1);
      const x = sidePad + i * slot + (slot - barW) / 2;

      // Smooth pseudo-audio motion. Slow body with a little meter flicker.
      const slow = Math.sin(ts * b.speed + b.phase) * 0.5 + 0.5;
      const slow2 = Math.sin(ts * b.speed2 + b.phase2) * 0.5 + 0.5;
      const ripple = Math.sin(ts * 0.00018 + i * 0.55) * 0.5 + 0.5;

      let level = b.base + slow * b.amp + slow2 * 0.16 + ripple * 0.10;

      // Tame the edges; keep the center feeling weighted.
      const edgeFade = 0.72 + Math.sin(n * Math.PI) * 0.28;
      level *= edgeFade;
      level = Math.min(0.96, Math.max(0.10, level));

      const h = level * meterAreaHeight;
      const y = baseY - h;

      // Palette moves from teal/blue into muted pearl/rose.
      const hue = 185 + Math.sin(n * Math.PI * 1.15) * 28 + b.hueShift;

      // 1. Wide ghost column — makes it pillowy.
      drawBand(
        x - barW * 0.42,
        y - h * 0.035,
        barW * 1.84,
        h * 1.04,
        hue,
        0.13 * b.glow,
        48
      );

      // 2. Main soft meter body.
      drawBand(
        x,
        y,
        barW,
        h,
        hue,
        0.42 * b.glow,
        24
      );

      // 3. Inner highlight, narrower and higher.
      const innerH = h * (0.78 + slow2 * 0.12);
      drawBand(
        x + barW * 0.22,
        baseY - innerH,
        barW * 0.56,
        innerH,
        hue + 14,
        0.20 * b.glow,
        14
      );

      // 4. Rounded peak cap, very subtle — like an EQ LED behind glass.
      const capH = Math.max(8, barW * 0.75);
      roundedRect(ctx, x - barW * 0.12, y - capH * 0.45, barW * 1.24, capH, capH);
      ctx.fillStyle = `hsla(${hue + 16}, 90%, 78%, ${0.11 + slow * 0.05})`;
      ctx.shadowBlur = 22;
      ctx.shadowColor = `hsla(${hue + 16}, 90%, 78%, 0.18)`;
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    ctx.globalCompositeOperation = 'source-over';

    // Smoked-glass blur pass: a translucent overlay softens the whole meter bank.
    const veil = ctx.createLinearGradient(0, 0, 0, H);
    veil.addColorStop(0, 'rgba(4,8,12,0.52)');
    veil.addColorStop(0.36, 'rgba(4,8,12,0.10)');
    veil.addColorStop(0.72, 'rgba(4,8,12,0.06)');
    veil.addColorStop(1, 'rgba(4,8,12,0.72)');
    ctx.fillStyle = veil;
    ctx.fillRect(0, 0, W, H);

    // Soft floor shadow.
    const floor = ctx.createLinearGradient(0, H - H * 0.16, 0, H);
    floor.addColorStop(0, 'rgba(0,0,0,0)');
    floor.addColorStop(1, 'rgba(0,0,0,.85)');
    ctx.fillStyle = floor;
    ctx.fillRect(0, H - H * 0.16, W, H * 0.16);

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();


/* ── 3. SNOW — exact from your site ─────────── */
(function(){
  const canvas = document.getElementById('snow');
  const c = canvas.getContext('2d');

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize(); window.addEventListener('resize', resize);

  const particles = [];
  for(let i = 0; i < 220; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 2 + 1,
      d: Math.random() * 1.8 + 1
    });
  }

  function snow(){
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = 'rgba(230,255,255,0.8)';
    particles.forEach(p => {
      c.beginPath();
      c.arc(p.x, p.y, p.r, 0, Math.PI * 2, false);
      c.fill();
      p.y += p.d;
      p.x += Math.sin(p.y * 0.01) * 0.8;
      if(p.y > canvas.height){ p.y = -10; p.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(snow);
  }
  snow();
})();
</script>
</body>
</html>
