<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Video — MAINLINE AUDIO</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background:#0a0a0a; 
      color:#f5f5f5; 
      font-family:'Satoshi',sans-serif; 
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:2rem;
    }
    .container {
      max-width:900px;
      width:100%;
      text-align:center;
    }
    video {
      width:100%;
      max-width:800px;
      border-radius:12px;
      box-shadow:0 8px 32px rgba(0,0,0,0.6);
      margin:2rem auto;
      display:block;
      background:#000;
    }
    h1 {
      font-size:2.5rem;
      font-weight:700;
      margin-bottom:0.5rem;
      background:linear-gradient(90deg,#ffffff,#b8f8ff,#ffe0ff);
      background-size:200%;
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .subtitle {
      font-size:1.1rem;
      opacity:0.6;
      margin-bottom:1rem;
    }
    .note {
      font-size:0.9rem;
      opacity:0.5;
      margin-top:2rem;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MAINLINE AUDIO</h1>
    <p class="subtitle">Mix & Sound Design Demo</p>
    <p style="opacity:0.5; font-size:0.95rem; margin-bottom:1rem;">
      Portfolio video — best on headphones or monitors
    </p>
    
    <video controls preload="metadata">
      <source src="MUSIC/demo-video-1.mov" type="video/quicktime">
      Your browser does not support the video tag.
    </video>

    <div class="note">
      <p><strong>About this project:</strong></p>
      <p>Sound design and mixing showcase</p>
      <p style="margin-top:1.5rem;">
        <strong>Tools:</strong> Pro Tools, iZotope RX, FabFilter
      </p>
      <p style="margin-top:1rem; opacity:0.3;">Henry Still — Audio Production</p>
    </div>
  </div>
</body>
</html>
