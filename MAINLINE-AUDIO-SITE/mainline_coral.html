<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mainline Audio — Listen</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: "Satoshi", sans-serif;
    overflow: hidden;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bg    { z-index: 1; }
  #coral { z-index: 2; pointer-events: none; }
  #snow  { z-index: 3; pointer-events: none; }

  .stage {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 30vh;
    pointer-events: none;
  }

  .logo-img {
    width: min(340px, 70vw);
    filter: drop-shadow(0 0 36px rgba(184,248,255,0.14));
    opacity: 0;
    animation: rise 2.4s cubic-bezier(.22,1,.36,1) .6s forwards;
  }
  .rule {
    width: min(340px, 70vw); height: 1px;
    background: rgba(184,248,255,0.09);
    margin: 24px 0 20px;
    opacity: 0;
    animation: rise 2s ease 1.4s forwards;
  }
  .tagline {
    font-size: clamp(.65rem, 1.4vw, .8rem);
    font-weight: 500; letter-spacing: .3em;
    text-transform: uppercase;
    opacity: 0;
    animation: rise 2s ease 1.8s forwards;
  }

  /* ── Player ── */
  .player {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 0 0 32px;
    opacity: 0; transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
  }
  .player.show { opacity: 1; transform: translateY(0); }

  .track-title {
    font-size: 10px; font-weight: 500;
    letter-spacing: .22em; text-transform: uppercase;
    color: rgba(245,245,245,0.45);
    margin-bottom: 20px;
    min-width: 160px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .controls {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
  }
  .ctrl-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background .18s, border-color .18s;
    color: rgba(245,245,245,0.6); font-size: 15px; user-select: none;
  }
  .ctrl-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
    color: #f5f5f5;
  }
  .ctrl-btn.play-btn {
    width: 54px; height: 54px;
    border-color: rgba(184,248,255,0.18);
    background: rgba(184,248,255,0.06);
  }
  .ctrl-btn.play-btn:hover {
    background: rgba(184,248,255,0.14);
    border-color: rgba(184,248,255,0.35);
  }

  .progress-wrap {
    display: flex; align-items: center; gap: 10px;
    width: min(420px, 88vw); margin-bottom: 14px;
  }
  .time-label {
    font-size: 9px; letter-spacing: .1em;
    color: rgba(245,245,245,0.22);
    font-variant-numeric: tabular-nums;
    width: 32px; flex-shrink: 0;
  }
  .time-label.right { text-align: right; }
  .progress-track {
    flex: 1; height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px; cursor: pointer; position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #b8f8ff, #ffe0ff);
    border-radius: 99px; width: 0%;
    pointer-events: none; transition: width .25s linear;
  }

  .volume-row { display: flex; align-items: center; gap: 10px; }
  .vol-icon { color: rgba(245,245,245,0.25); font-size: 12px; }
  input[type=range].vol-slider {
    -webkit-appearance: none; width: 90px; height: 3px;
    border-radius: 99px; background: rgba(255,255,255,0.1);
    cursor: pointer; outline: none;
  }
  input[type=range].vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none; width: 10px; height: 10px;
    border-radius: 50%; background: rgba(184,248,255,0.8); cursor: pointer;
  }

  .gradient-text {
    background: linear-gradient(90deg, #ffffff, #b8f8ff, #ffe0ff, #f0e8ff, #ffffff);
    background-size: 400%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: flow 18s ease infinite;
  }
  @keyframes flow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .start-overlay {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: opacity .6s;
  }
  .start-overlay.hidden { opacity: 0; pointer-events: none; }
  .start-hint {
    font-size: 10px; font-weight: 500;
    letter-spacing: .28em; text-transform: uppercase;
    color: rgba(245,245,245,0.22);
    animation: pulse 2.8s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .22; }
    50%       { opacity: .55; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="coral"></canvas>
<canvas id="snow"></canvas>

<div class="stage">
  <img class="logo-img"
    src="https://mainline-audio.com/MAINLINE-AUDIO-SITE/mainline_logo_transparent.png"
    alt="Mainline Audio" crossorigin="anonymous">
  <div class="rule"></div>
  <p class="tagline gradient-text">Mastering — Orlando, FL</p>
</div>

<div class="player" id="player">
  <div class="track-title" id="track-title">—</div>
  <div class="controls">
    <div class="ctrl-btn" id="prev-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </div>
    <div class="ctrl-btn play-btn" id="play-btn">
      <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
    </div>
    <div class="ctrl-btn" id="next-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6zm8.5-6v6h2V6h-2z"/></svg>
    </div>
  </div>
  <div class="progress-wrap">
    <span class="time-label" id="time-cur">0:00</span>
    <div class="progress-track" id="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <span class="time-label right" id="time-dur">0:00</span>
  </div>
  <div class="volume-row">
    <span class="vol-icon">♪</span>
    <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="0.65">
  </div>
</div>

<div class="start-overlay" id="start-overlay">
  <p class="start-hint">Tap to listen</p>
</div>

<audio id="audio" preload="auto"></audio>

<script>
/* ════════════════════════════════
   SHARED AUDIO + ANALYSER
   (accessible by all canvas scripts)
════════════════════════════════ */
const playlist = [
  { title: "Drift",                src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Drift_Master_01.mp3" },
  { title: "Draped",               src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Draped_Master_01.mp3" },
  { title: "Still Waters",         src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Still Waters_Master_01.mp3" },
  { title: "Weightless",           src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/SRS_Weightless_Master_01.mp3" },
  { title: "When the Mud Settles", src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/when the mud settles.m4a" },
  { title: "Run Free",             src: "https://mainline-audio.com/MAINLINE-AUDIO-SITE/MUSIC/Run Free.mp3" },
];

function shuffle(arr){
  const s = [...arr];
  for(let i = s.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [s[i], s[j]] = [s[j], s[i]];
  }
  return s;
}

const audio        = document.getElementById('audio');
const playBtn      = document.getElementById('play-btn');
const playIcon     = document.getElementById('play-icon');
const pauseIcon    = document.getElementById('pause-icon');
const nextBtn      = document.getElementById('next-btn');
const prevBtn      = document.getElementById('prev-btn');
const trackTitle   = document.getElementById('track-title');
const progressFill = document.getElementById('progress-fill');
const progressTrack= document.getElementById('progress-track');
const timeCur      = document.getElementById('time-cur');
const timeDur      = document.getElementById('time-dur');
const volSlider    = document.getElementById('vol-slider');
const playerEl     = document.getElementById('player');
const startOverlay = document.getElementById('start-overlay');

// Global analyser — coral canvas reads from this
let analyser = null, dataArray = null, audioCtx = null;

let shuffled = shuffle(playlist);
let idx = 0, started = false;

function fmt(s){
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function loadTrack(i, autoplay){
  audio.src = shuffled[i].src;
  trackTitle.textContent = shuffled[i].title;
  progressFill.style.width = '0%';
  timeCur.textContent = '0:00';
  timeDur.textContent = '0:00';
  if(autoplay) audio.play().catch(()=>{});
}

function updatePlayPause(){
  const playing = !audio.paused;
  playIcon.style.display  = playing ? 'none'  : 'block';
  pauseIcon.style.display = playing ? 'block' : 'none';
}

function setupAnalyser(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaElementSource(audio);
  analyser  = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  dataArray = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function startAudio(){
  if(started) return; started = true;
  setupAnalyser();
  loadTrack(idx, true);
  playerEl.classList.add('show');
  startOverlay.classList.add('hidden');
}

startOverlay.addEventListener('click', startAudio);
playBtn.addEventListener('click', () => {
  if(!started){ startAudio(); return; }
  audio.paused ? audio.play() : audio.pause();
});
nextBtn.addEventListener('click', () => {
  idx = (idx + 1) % shuffled.length;
  if(idx === 0) shuffled = shuffle(playlist);
  loadTrack(idx, started);
});
prevBtn.addEventListener('click', () => {
  if(audio.currentTime > 3){ audio.currentTime = 0; }
  else { idx = (idx - 1 + shuffled.length) % shuffled.length; loadTrack(idx, started); }
});
audio.addEventListener('ended', () => {
  idx = (idx + 1) % shuffled.length;
  if(idx === 0) shuffled = shuffle(playlist);
  loadTrack(idx, true);
});
audio.addEventListener('play',  updatePlayPause);
audio.addEventListener('pause', updatePlayPause);
audio.addEventListener('timeupdate', () => {
  if(!audio.duration) return;
  progressFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
  timeCur.textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => { timeDur.textContent = fmt(audio.duration); });
progressTrack.addEventListener('click', e => {
  if(!audio.duration) return;
  const r = progressTrack.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});
volSlider.addEventListener('input', e => { audio.volume = parseFloat(e.target.value); });
audio.volume = parseFloat(volSlider.value);


/* ════════════════════════════════
   BACKGROUND
════════════════════════════════ */
(function(){
  const c = document.getElementById('bg');
  const ctx = c.getContext('2d');
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  function draw(ts){
    const W = c.width, H = c.height;
    const t = ts * 0.00013;
    const topH = 222 + Math.sin(t) * 7;
    const botH = 198 + Math.sin(t * .5) * 5;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0,   `hsl(${topH}, 48%, 4%)`);
    g.addColorStop(.45, `hsl(${topH-8}, 42%, 7%)`);
    g.addColorStop(.82, `hsl(${botH}, 36%, 10%)`);
    g.addColorStop(1,   `hsl(${botH-10}, 30%, 5%)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for(let i = 0; i < 3; i++){
      const bx = (Math.sin(ts * (0.00024 + i * 0.00008) + i * 2.1) * .5 + .5) * W;
      const by = H * (0.04 + i * 0.07);
      const beam = ctx.createRadialGradient(bx, by, 0, bx, by, W * .52);
      beam.addColorStop(0,  `rgba(184,248,255,${0.028 - i * 0.007})`);
      beam.addColorStop(.7, 'rgba(0,0,0,0)');
      ctx.fillStyle = beam; ctx.fillRect(0, 0, W, H);
    }
    const vig = ctx.createRadialGradient(W*.5, H*.38, H*.14, W*.5, H*.38, H*.9);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();


/* ════════════════════════════════
   CORAL REEF — audio reactive
   When music plays: stalk heights
   driven by frequency bin data.
   Low bins → left stalks,
   High bins → right stalks.
   Idle: organic sine fallback.
════════════════════════════════ */
(function(){
  const c = document.getElementById('coral');
  const ctx = c.getContext('2d');
  function resize(){ c.width = window.innerWidth; c.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  const COUNT = 90;
  const PALETTE = [
    [8,  35, 42],
    [340,28, 45],
    [18, 30, 38],
    [185,25, 35],
    [195,22, 40],
    [270,18, 38],
    [30, 25, 50],
    [0,  15, 52],
  ];

  const stalks = Array.from({length: COUNT}, (_, i) => {
    const [h, s, l] = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    const widthClass = Math.random();
    const baseW = widthClass < 0.6
      ? 0.4 + Math.random() * 0.6
      : 1.2 + Math.random() * 1.8;
    const heightBias = Math.random();
    const maxFrac = heightBias < 0.55
      ? 0.10 + Math.random() * 0.18
      : heightBias < 0.82
      ? 0.22 + Math.random() * 0.20
      : 0.40 + Math.random() * 0.22;
    return {
      phase:  Math.random() * Math.PI * 2,
      freq:   0.1 + Math.random() * 0.35,
      amp:    0.15 + Math.random() * 0.55,
      swayF:  0.00018 + Math.random() * 0.00022,
      swayA:  2 + Math.random() * 8,
      h, s, l, baseW, maxFrac,
      branchStyle: Math.floor(Math.random() * 3),
      lean: (Math.random() - 0.5) * 0.18,
      // Audio target & current for smooth lerp
      current: 0.08 + Math.random() * 0.25,
      target:  0.08,
      fpos: i / (COUNT - 1), // 0=left/low, 1=right/high
    };
  });

  function drawBranch(ctx, x, y, angle, len, depth, h, s, l, alpha){
    if(depth === 0 || len < 3) return;
    const ex = x + Math.sin(angle) * len;
    const ey = y - Math.cos(angle) * len;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey);
    ctx.strokeStyle = `hsla(${h}, ${s}%, ${l + depth * 5}%, ${alpha})`;
    ctx.lineWidth = Math.max(0.4, depth * 0.7);
    ctx.stroke();
    const spread = 0.3 + Math.random() * 0.25;
    drawBranch(ctx, ex, ey, angle - spread, len * 0.62, depth - 1, h, s, l, alpha * 0.85);
    drawBranch(ctx, ex, ey, angle + spread, len * 0.62, depth - 1, h, s, l, alpha * 0.85);
  }

  let currentPhase = 0;

  function draw(ts){
    const W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    currentPhase = ts * 0.00016;
    const t = ts * 0.001;
    const slotW = W / COUNT;

    stalks.forEach((s, i) => {

      // ── Audio reactive height ──
      if(analyser && dataArray && !audio.paused){
        analyser.getByteFrequencyData(dataArray);
        // Map stalk position to frequency bin
        const bin = Math.floor(s.fpos * dataArray.length * 0.8);
        // Drive target height from frequency energy
        // Scale by stalk's own maxFrac so tall ones stay tall
        const energy = dataArray[bin] / 255;
        s.target = Math.max(0.03, energy * s.maxFrac * 1.4);
      } else {
        // Idle sine fallback
        const v =
          Math.sin(t * s.freq       + s.phase) * s.amp * .6 +
          Math.sin(t * s.freq * 1.8 + s.phase * 1.3) * s.amp * .25 +
          Math.sin(t * s.freq * 0.3 + s.phase * .7) * s.amp * .15;
        s.target = Math.max(0.03, ((v + 1) / 2) * s.maxFrac);
      }

      // Smooth lerp — fast attack, slow decay (natural coral sway feel)
      const speed = s.current < s.target ? 0.14 : 0.06;
      s.current += (s.target - s.current) * speed;

      const barH  = Math.max(4, s.current * H * 0.85);
      const rootX = i * slotW + slotW / 2;
      const tipY  = H - barH;

      const shared     = Math.sin(currentPhase + i * 0.12) * 6;
      const individual = Math.sin(ts * s.swayF + s.phase) * s.swayA;
      const totalSway  = shared + individual;
      const leanOffset = s.lean * barH;
      const w2 = (slotW * s.baseW) * 0.5;

      const rootW = w2 * 1.0;
      const tipW  = w2 * 0.18;
      const tipX  = rootX + totalSway + leanOffset;
      const ctrlX = rootX + (totalSway + leanOffset) * 0.4;
      const ctrlY = H - barH * 0.55;

      const gr = ctx.createLinearGradient(rootX, H, tipX, tipY);
      gr.addColorStop(0,    `hsla(${s.h}, ${s.s}%, ${s.l - 15}%, 0)`);
      gr.addColorStop(0.08, `hsla(${s.h}, ${s.s}%, ${s.l - 10}%, 0.3)`);
      gr.addColorStop(0.5,  `hsla(${s.h}, ${s.s}%, ${s.l}%,       0.65)`);
      gr.addColorStop(1,    `hsla(${s.h}, ${s.s + 8}%, ${s.l + 12}%, 0.78)`);

      ctx.beginPath();
      ctx.moveTo(rootX - rootW, H);
      ctx.quadraticCurveTo(ctrlX - tipW * 1.5, ctrlY, tipX - tipW, tipY);
      ctx.lineTo(tipX + tipW, tipY);
      ctx.quadraticCurveTo(ctrlX + tipW * 1.5, ctrlY, rootX + rootW, H);
      ctx.closePath();
      ctx.fillStyle = gr;
      ctx.fill();

      if(s.branchStyle === 1 && barH > H * 0.08){
        ctx.save();
        drawBranch(ctx, tipX, tipY + 2, 0, barH * 0.12, 2, s.h, s.s, s.l + 10, 0.55);
        ctx.restore();
      } else if(s.branchStyle === 2){
        const dotCount = 3 + Math.floor(s.current * 4);
        for(let d = 0; d < dotCount; d++){
          const angle = (d / (dotCount - 1) - 0.5) * Math.PI * 0.7;
          const dr = barH * 0.06;
          const dx = tipX + Math.sin(angle) * dr * 3;
          const dy = tipY - Math.cos(angle) * dr * 2;
          const dotR = Math.max(0.6, w2 * 0.35 * (1 - Math.abs(d - dotCount/2) / dotCount));
          ctx.beginPath();
          ctx.arc(dx, dy, dotR, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${s.h + 10}, ${s.s + 10}%, ${s.l + 18}%, 0.7)`;
          ctx.fill();
        }
      }
    });

    const floor = ctx.createLinearGradient(0, H - H * 0.1, 0, H);
    floor.addColorStop(0, 'rgba(0,0,0,0)');
    floor.addColorStop(1, 'rgba(4,7,12,.95)');
    ctx.fillStyle = floor;
    ctx.fillRect(0, H - H * 0.1, W, H * 0.1);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();


/* ════════════════════════════════
   SNOW — exact from your site
════════════════════════════════ */
(function(){
  const canvas = document.getElementById('snow');
  const c = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  const particles = [];
  for(let i = 0; i < 220; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      r: Math.random() * 2 + 1,
      d: Math.random() * 1.8 + 1
    });
  }
  function snow(){
    c.clearRect(0, 0, canvas.width, canvas.height);
    c.fillStyle = 'rgba(230,255,255,0.8)';
    particles.forEach(p => {
      c.beginPath(); c.arc(p.x, p.y, p.r, 0, Math.PI * 2, false); c.fill();
      p.y += p.d; p.x += Math.sin(p.y * 0.01) * 0.8;
      if(p.y > canvas.height){ p.y = -10; p.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(snow);
  }
  snow();
})();
</script>
</body>
</html>
