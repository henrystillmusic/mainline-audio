<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mainline Audio — Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Courier+Prime:wght@400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #080808;
    --white: #f0ece4;
    --dim: rgba(240,236,228,0.12);
    --mid: rgba(240,236,228,0.45);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    overflow: hidden;
    font-family: 'Courier Prime', monospace;
  }

  /* ── Canvas layers ── */
  #bg-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #grain {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
    opacity: .18;
    pointer-events: none;
  }

  /* ── Center stage ── */
  .stage {
    position: fixed; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  /* Logo image */
  .logo-img {
    width: min(340px, 72vw);
    opacity: 0;
    filter: brightness(0) invert(1);
    animation: fadeIn 2.2s ease 0.6s forwards;
  }

  /* Thin rule */
  .rule {
    width: min(340px, 72vw);
    height: 1px;
    background: var(--dim);
    margin: 28px 0 26px;
    opacity: 0;
    animation: fadeIn 1.8s ease 1.4s forwards;
  }

  /* Tagline */
  .tagline {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    color: var(--mid);
    letter-spacing: 0.18em;
    text-transform: none;
    opacity: 0;
    animation: fadeIn 1.8s ease 1.8s forwards;
  }

  /* Bottom label */
  .bottom-label {
    position: fixed;
    bottom: 42px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    font-family: 'Courier Prime', monospace;
    font-size: clamp(0.6rem, 1.4vw, 0.72rem);
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--dim);
    opacity: 0;
    animation: fadeIn 2s ease 2.4s forwards;
    white-space: nowrap;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Waveform bar overlay */
  #wave-canvas {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%; height: 28%;
    z-index: 5;
    opacity: 0.22;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Background plasma / orb canvas -->
<canvas id="bg-canvas"></canvas>

<!-- Film grain canvas -->
<canvas id="grain"></canvas>

<!-- Waveform visualizer -->
<canvas id="wave-canvas"></canvas>

<!-- Center content -->
<div class="stage">
  <img
    class="logo-img"
    src="https://mainline-audio.com/MAINLINE-AUDIO-SITE/mainline_logo_transparent.png"
    alt="Mainline Audio"
    crossorigin="anonymous"
  >
  <div class="rule"></div>
  <p class="tagline">Mastering — Orlando, FL</p>
</div>

<div class="bottom-label">mainline-audio.com</div>

<script>
/* ════════════════════════════════════════════
   1. BACKGROUND — slow drifting plasma orbs
   ════════════════════════════════════════════ */
(function() {
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let W, H;

  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  // Orbs
  const orbs = [
    { x: 0.25, y: 0.35, r: 0.55, hue: 220, vx: 0.00012, vy: 0.00008, phase: 0 },
    { x: 0.75, y: 0.65, r: 0.45, hue: 200, vx:-0.00009, vy: 0.00011, phase: 1.8 },
    { x: 0.50, y: 0.80, r: 0.38, hue: 240, vx: 0.00007, vy:-0.00013, phase: 3.5 },
    { x: 0.15, y: 0.75, r: 0.30, hue: 190, vx:-0.00006, vy:-0.00009, phase: 5.1 },
  ];

  let t = 0;

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#080808';
    ctx.fillRect(0, 0, W, H);

    orbs.forEach(o => {
      // Slow sinusoidal drift
      const ox = (o.x + Math.sin(t * o.vx * 6000 + o.phase) * 0.15) * W;
      const oy = (o.y + Math.cos(t * o.vy * 6000 + o.phase) * 0.12) * H;
      const rad = o.r * Math.min(W, H);

      const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, rad);
      g.addColorStop(0,   `hsla(${o.hue}, 30%, 18%, 0.55)`);
      g.addColorStop(0.5, `hsla(${o.hue}, 25%, 10%, 0.25)`);
      g.addColorStop(1,   `hsla(${o.hue}, 20%,  5%, 0)`);

      ctx.beginPath();
      ctx.arc(ox, oy, rad, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    });

    // Subtle vignette
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.82)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    t = performance.now();
    requestAnimationFrame(draw);
  }
  draw();
})();


/* ════════════════════════════════════════════
   2. FILM GRAIN
   ════════════════════════════════════════════ */
(function() {
  const c = document.getElementById('grain');
  const ctx = c.getContext('2d');
  let W, H;

  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawGrain() {
    const img = ctx.createImageData(W, H);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const v = (Math.random() * 255) | 0;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 22;
    }
    ctx.putImageData(img, 0, 0);
    // Refresh grain every 2 frames for subtlety
    setTimeout(() => requestAnimationFrame(drawGrain), 32);
  }
  drawGrain();
})();


/* ════════════════════════════════════════════
   3. WAVEFORM — animated synthetic bars
   ════════════════════════════════════════════ */
(function() {
  const c = document.getElementById('wave-canvas');
  const ctx = c.getContext('2d');
  let W, H;

  function resize() {
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight * 0.28;
  }
  resize();
  window.addEventListener('resize', resize);

  const BARS = 90;
  // Each bar has its own phase offset and speed for organic feel
  const phases = Array.from({ length: BARS }, (_, i) => ({
    base: Math.random() * Math.PI * 2,
    freq: 0.6 + Math.random() * 1.2,
    amp:  0.3 + Math.random() * 0.7,
  }));

  function draw(ts) {
    ctx.clearRect(0, 0, W, H);
    const t = ts / 1000;
    const barW = W / BARS;
    const gap = barW * 0.3;

    for (let i = 0; i < BARS; i++) {
      const p = phases[i];
      // Layered sines for natural waveform feel
      const v =
        Math.sin(t * p.freq       + p.base) * p.amp * 0.5 +
        Math.sin(t * p.freq * 1.7 + p.base * 1.3) * p.amp * 0.3 +
        Math.sin(t * p.freq * 0.5 + p.base * 0.7) * p.amp * 0.2;

      const norm = (v + 1) / 2; // 0..1
      const barH = Math.max(2, norm * H * 0.85);
      const x = i * barW + gap / 2;
      const y = H - barH;

      // Gradient per bar: bright top → transparent bottom
      const gr = ctx.createLinearGradient(0, y, 0, H);
      gr.addColorStop(0,   'rgba(200,195,185, 0.9)');
      gr.addColorStop(0.5, 'rgba(160,155,145, 0.4)');
      gr.addColorStop(1,   'rgba(100,95,85,   0)');

      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.roundRect(x, y, barW - gap, barH, [2, 2, 0, 0]);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
